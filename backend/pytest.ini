[pytest]
pythonpath = .
testpaths = app/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
log_cli = false
log_level = WARNING
filterwarnings =
    ignore::DeprecationWarning
# Mock Google credentials — ensures auth_service runs in sandbox mode during all tests
env =
    GOOGLE_CLIENT_ID=mock-google-client-id.apps.googleusercontent.com
    GOOGLE_CLIENT_SECRET=mock-google-client-secret
