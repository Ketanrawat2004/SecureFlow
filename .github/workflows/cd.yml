name: SecureFlow CD Pipeline

# ============================================================================
# SecureFlow Continuous Deployment
# ============================================================================
# Deployment strategy:
#   - Frontend  →  Render Static Site  (auto-deploys on push via Render GitHub integration)
#   - Backend   →  Render Web Service  (auto-deploys on push via Render GitHub integration)
#
# This workflow acts as a post-CI deployment gate:
#   1. Verifies the production build succeeds
#   2. Confirms all tests pass before the branch is live
#   3. (Optional) Triggers a Render deploy hook if RENDER_DEPLOY_HOOK_URL is set
#
# To enable manual deploy triggers, add the following GitHub repository secret:
#   RENDER_DEPLOY_HOOK_URL  — from Render dashboard → Settings → Deploy Hook
#
# NOTE: AWS ECS deployment is defined in terraform/ and requires an AWS account.
#       It is NOT active here. To enable AWS deployment, see docs/DEPLOYMENT_RENDER.md.
# ============================================================================

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — Test & Verify
  # ─────────────────────────────────────────────────────────────────────────
  backend-verify:
    name: Backend — Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_RATE_LIMIT_ENABLED: "false"
          KAFKA_ENABLED: "false"
          AUTO_SEED_DATABASE: "true"
          GOOGLE_CLIENT_ID: mock-google-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: mock-google-client-secret
          JWT_SECRET_KEY: ci-test-secret-key-min-32-characters-long
        run: pytest app/tests/ -q --tb=short

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Test, Typecheck & Production Build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-verify:
    name: Frontend — Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest suite
        working-directory: frontend
        run: npm test

      - name: TypeScript check + Vite production build
        working-directory: frontend
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────
  # Docker Compose — Configuration Validation
  # ─────────────────────────────────────────────────────────────────────────
  docker-validate:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  # ─────────────────────────────────────────────────────────────────────────
  # Render Deploy — Trigger after all checks pass
  # Requires RENDER_DEPLOY_HOOK_URL secret in GitHub repository settings.
  # If the secret is not set, this step is skipped gracefully.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-render:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-verify, docker-validate]
    environment: production
    steps:
      - name: Trigger Render deploy hook (if configured)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Render deployment..."
          curl -f -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | jq .
          echo "Deploy triggered successfully."

      - name: Skip notification (Render auto-deploys from GitHub)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "✅ All checks passed."
          echo "Render auto-deploys from the main branch via GitHub integration."
          echo "No deploy hook configured — deployment is handled automatically."
          echo "To add a manual trigger, set RENDER_DEPLOY_HOOK_URL in GitHub Secrets."
