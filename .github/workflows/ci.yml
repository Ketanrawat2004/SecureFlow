name: SecureFlow CI Pipeline

# ============================================================================
# SecureFlow Continuous Integration
# Runs on every push to main/develop and on all pull requests.
# ============================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — Python tests with pytest
  # ─────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend pytest suite
        working-directory: backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_RATE_LIMIT_ENABLED: "false"
          KAFKA_ENABLED: "false"
          AUTO_SEED_DATABASE: "true"
          # Mock Google credentials — tests always run in sandbox mode
          GOOGLE_CLIENT_ID: mock-google-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: mock-google-client-secret
          JWT_SECRET_KEY: ci-test-secret-key-min-32-characters-long
        run: pytest app/tests/ -q --tb=short --cov=app --cov-report=term-missing

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Vitest + TypeScript check + Vite production build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest suite
        working-directory: frontend
        run: npm test

      - name: TypeScript check + Vite production build
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # Docker Compose — Configuration validation (no build required)
  # ─────────────────────────────────────────────────────────────────────────
  docker-validate:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
