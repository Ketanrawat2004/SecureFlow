services:
  # ==============================================================================
  # SecureFlow Backend API (FastAPI + Uvicorn)
  # ==============================================================================
  - type: web
    name: secureflow-api
    env: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: SecureFlow
      - key: KAFKA_ENABLED
        value: "false"
      - key: AUTO_SEED_DATABASE
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: secureflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: secureflow-cache
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false

  # ==============================================================================
  # SecureFlow Frontend (React + TypeScript + Vite Static Site)
  # ==============================================================================
  - type: web
    name: secureflow-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_TITLE
        value: SecureFlow

# ==============================================================================
# Managed PostgreSQL Database (Free Tier)
# ==============================================================================
databases:
  - name: secureflow-db
    plan: free
    region: oregon
    databaseName: secureflow
    user: secureflow_user
